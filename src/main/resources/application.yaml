spring:
  application:
    name: test-spring4

  datasource:
    url: jdbc:postgresql://${POSTGRES_SQL_HOST}:${POSTGRES_SQL_PORT}/${POSTGRES_SQL_DB}
    username: ${POSTGRES_SQL_USERNAME}
    password: ${POSTGRES_SQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  thymeleaf:
    cache: false # Désactive le cache Thymeleaf (Correctement placé)

  devtools: # Sorti du bloc thymeleaf, aligné directement sous spring
    restart:
      enabled: true

  # =======================
  # SERVEUR DE MESSAGERIE #
  # =======================
  mail:
    host: "${SMTP_HOST}"
    port: "${SMTP_PORT}"
    username: "${SMTP_USERNAME}" # Remplacez par votre e-mail Office 365
    password: "${SMTP_PASSWORD}"       # Surchargé en production pour la sécurité
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        # Sécurisation contre les blocages de connexions infinies
        debug: false

server:
  port: 8087
  error:
    include-message: never

# ==========================================================================
# REPARAMÉTRAGE INSTITUTIONNEL & PARAMÈTRES D'AMORÇAGE (GIM-MINI-CBS)
# ==========================================================================
minicbs:
  init:
    # Profil souverain du Super Administrateur
    admin:
      nom: "GIM"
      prenom: "Super Admin"
      email: "admin@gimminicbs.org"
      username: "superadmin"
      telephone: "+2250102030405"
      password: "${MINICBS_ADMIN_PASSWORD:Admin@2026}" # Supporte la surcharge par variable d'environnement

    # Rôles système requis pour l'habilitation future
    roles:
      - "ROLE_SUPER_ADMIN"
      - "ROLE_MANAGER"
      - "ROLE_GUICHETIER"

    # Paramètres institutionnels, financiers et de structure General Ledger (GL)
    parameters:
      - key: "BANK_BIN"
        value: "400012"
        description: "Bank Identification Number (BIN) officiel GIM"
        editable: true
      - key: "BANK_CODE_ETAB"
        value: "CI054"
        description: "Code Etablissement Banque Centrale (BCEAO)"
        editable: true
      - key: "BANK_CODE_GUICHET"
        value: "01001"
        description: "Code Guichet du Siege Principal"
        editable: true
      - key: "FEE_RATE_TRANSACTION"
        value: "0.005"
        description: "Taux de prélèvement des frais sur opérations de guichet (0.5%)"
        editable: true
      - key: "GL_ACCOUNT_CAISSE"
        value: "CI0540100101999999999911"
        description: "Compte General Interne - Encaisse Physique Coffre-fort"
        editable: false # Verrouillé par sécurité
      - key: "GL_ACCOUNT_PRODUITS"
        value: "CI0540100101999999999922"
        description: "Compte General Interne - Commissions et Produits perçus"
        editable: false
      - key: "GL_ACCOUNT_CAPITAL"
        value: "CI0540100101999999999933"
        description: "Compte General Interne - Capital Social de l'institution"
        editable: false
      - key: "GL_ACCOUNT_LIAISON"
        value: "CI0540100101999999999944"
        description: "Compte General Interne - Liaison et Compensation Interbancaire GIM"
        editable: false
      - key: "MAIL_FROM_ADDRESS"
        value: "giift@gim-uemoa.org"
        description: "Adresse email d'expédition des alertes de sécurité"
        editable: true
      - key: "BANK_DISPLAY_NAME"
        value: "Mini CBS"
        description: "Nom commercial de l'établissement affiché dans les correspondances"
        editable: true

  app:
    base-url: ${MINICBS_BASE_URL:http://localhost:8087}

