<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Admin Portal">Admin Portal</title>

    <!-- Bootstrap CSS local -->
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Bootstrap Icons local -->
    <link th:href="@{/vendor/bootstrap-icons/bootstrap-icons.css}" rel="stylesheet">
    <!-- Application CSS centralisé -->
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebarMenu">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>

<!-- MAIN CONTENT WRAPPER -->
<div class="main-wrapper">
    <main class="content-area">

        <!-- Breadcrumb & Zone Titre épurée -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <nav aria-label="breadcrumb" class="small text-muted mb-1">
                    <span class="text-secondary">Console</span> / <span class="fw-medium text-primary">Gestion</span>
                </nav>
                <h1 class="h3 fw-bold text-dark m-0" layout:fragment="page-title">
                    Tableau de bord
                </h1>
            </div>
        </div>

        <!-- Flash messages -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Page content dynamic injection -->
        <section layout:fragment="content">
            <!-- contenu des pages -->
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="border-top border-light py-3 bg-white bg-opacity-50 mt-auto">
        <div th:insert="~{fragments/footer :: footer}"></div>
    </footer>
</div>

<!-- JAVASCRIPT DEPENDENCIES -->
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script src="/vendor/htmx/htmx.min.js" defer></script>
<script th:src="@{/vendor/alpine/alpine.min.js}" defer></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
