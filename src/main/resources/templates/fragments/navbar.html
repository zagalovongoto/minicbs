<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary border-opacity-10 shadow-sm">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <div class="bg-primary bg-gradient p-2 rounded-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 32px; height: 32px;">
                <i class="bi bi-grid-1x2-fill text-white fs-6"></i>
            </div>
            <span class="tracking-tight text-white fs-5">Admin<span class="text-primary fw-light">Portal</span></span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="ms-auto d-flex align-items-center gap-2">
            <!-- Cloche notifications stylisée -->
            <button class="btn btn-icon btn-link text-white-50 position-relative p-2 hover:text-white transition">
                <i class="bi bi-bell fs-5"></i>
                <span class="position-absolute top-2 start-3 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
            </button>

            <!-- Profil utilisateur avec Dropdown haut de gamme -->
            <div class="dropdown">
                <a class="d-flex align-items-center gap-2 text-white-50 text-decoration-none dropdown-toggle px-3 py-1.5 rounded-3 hover:bg-white hover:bg-opacity-10 transition"
                   href="#" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle fs-5 text-white"></i>
                    <span class="d-none d-sm-inline text-white small fw-medium">Administrateur</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2 p-2" style="border-radius: 12px; min-width: 200px;">
                    <li>
                        <a class="dropdown-item rounded-3 d-flex align-items-center gap-2 py-2" href="#">
                            <i class="bi bi-person text-muted"></i> Mon profil
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item rounded-3 d-flex align-items-center gap-2 py-2" href="#">
                            <i class="bi bi-gear text-muted"></i> Paramètres
                        </a>
                    </li>
                    <li><hr class="dropdown-divider opacity-50"></li>
                    <li>
                        <a class="dropdown-item text-danger rounded-3 d-flex align-items-center gap-2 py-2" href="#">
                            <i class="bi bi-box-arrow-right"></i> Déconnexion
                        </a>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</nav>
</body>
</html>
