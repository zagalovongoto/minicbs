<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{layouts/main}"> <!-- FIXE : Décoration statique obligatoire -->
<head>
    <meta charset="UTF-8">
    <title>Sécurité - Clé d'accès</title>
</head>
<body>

<div layout:fragment="content" class="card card-saas card-form shadow-sm mx-auto mt-4" style="max-width: 600px;">

    <div class="p-4 border-bottom bg-white" style="border-radius: 16px 16px 0 0;">
        <h4 class="fw-bold text-dark m-0"><i class="bi bi-shield-lock-fill text-primary me-2"></i>Clé de Sécurité de la Console</h4>
        <p class="text-muted small m-0 mt-1">Gérez la rotation de vos habilitations. Les clés doivent être uniques et conformes aux critères de complexité.</p>
    </div>

    <div class="p-4 bg-white" style="border-radius: 0 0 16px 16px;">
        <div th:if="${errorMessage}" class="alert alert-danger p-3 rounded-3 border-0 small fw-medium mb-4" th:text="${errorMessage}">Erreur</div>
        <div th:if="${successMessage}" class="alert alert-success p-3 rounded-3 border-0 small bg-success bg-opacity-10 text-success fw-medium mb-4">
            <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/profile/change-password}" method="post">
            <div class="mb-3">
                <label class="form-label-saas">Mot de passe actuel</label>
                <input type="password" name="currentPassword" class="form-control form-control-saas" placeholder="••••••••••••" required>
            </div>
            <div class="mb-3 border-top pt-3 mt-4">
                <label class="form-label-saas text-primary fw-bold">Nouveau mot de passe secret</label>
                <input type="password" name="newPassword" class="form-control form-control-saas" placeholder="Minimum 8 caractères" required>
            </div>
            <div class="mb-4">
                <label class="form-label-saas">Confirmez la nouvelle clé</label>
                <input type="password" name="confirmPassword" class="form-control form-control-saas" placeholder="Saisissez à l'identique" required>
            </div>
            <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-4">
                <a th:href="@{/}" class="btn btn-outline-secondary px-4 rounded-3 fw-medium small">Annuler</a>
                <button type="submit" class="btn btn-primary px-4 rounded-3 fw-medium small d-flex align-items-center gap-2 shadow-sm">
                    <i class="bi bi-arrow-repeat"></i> Mettre à jour la clé d'accès
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
